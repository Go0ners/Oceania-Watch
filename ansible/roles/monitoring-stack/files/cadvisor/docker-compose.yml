services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:{{ cadvisor_version | default('latest') }}
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "{{ cadvisor_port | default(8080) }}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
