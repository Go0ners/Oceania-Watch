services:
  node-exporter:
    image: prom/node-exporter:{{ node_exporter_version | default('latest') }}
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "{{ node_exporter_port | default(9100) }}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    user: "{{ node_exporter_user_id | default('65534') }}:{{ node_exporter_group_id | default('65534') }}"
