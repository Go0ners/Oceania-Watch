---
- name: Créer le répertoire de la stack monitoring
  ansible.builtin.file:
    path: "{{ monitoring_stack_dir }}"
    state: directory
    mode: '0755'
  tags:
    - monitoring

- name: Créer les sous-répertoires pour chaque service
  ansible.builtin.file:
    path: "{{ monitoring_stack_dir }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - prometheus
    - prometheus/rules
    - grafana
    - grafana/provisioning
    - grafana/provisioning/datasources
    - grafana/provisioning/dashboards
    - grafana/dashboards
    - alertmanager
    - node-exporter
    - cadvisor
    - loki
    - promtail
  tags:
    - monitoring

- name: Générer les fichiers Docker Compose depuis les templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ monitoring_stack_dir }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: 'docker-compose.yml.j2', dest: 'docker-compose.yml' }
    - { src: 'prometheus-compose.yml.j2', dest: 'prometheus/docker-compose.yml' }
    - { src: 'grafana-compose.yml.j2', dest: 'grafana/docker-compose.yml' }
    - { src: 'alertmanager-compose.yml.j2', dest: 'alertmanager/docker-compose.yml' }
    - { src: 'node-exporter-compose.yml.j2', dest: 'node-exporter/docker-compose.yml' }
    - { src: 'cadvisor-compose.yml.j2', dest: 'cadvisor/docker-compose.yml' }
    - { src: 'loki-compose.yml.j2', dest: 'loki/docker-compose.yml' }
    - { src: 'promtail-compose.yml.j2', dest: 'promtail/docker-compose.yml' }
  tags:
    - monitoring

- name: Générer les fichiers de configuration depuis les templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ monitoring_stack_dir }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: 'prometheus.yml.j2', dest: 'prometheus/prometheus.yml' }
    - { src: 'alert-rules.yml.j2', dest: 'prometheus/rules/alerts.yml' }
    - { src: 'recording-rules.yml.j2', dest: 'prometheus/rules/recording.yml' }
    - { src: 'alertmanager.yml.j2', dest: 'alertmanager/alertmanager.yml' }
    - { src: 'loki-config.yml.j2', dest: 'loki/loki-config.yml' }
    - { src: 'promtail-config.yml.j2', dest: 'promtail/promtail-config.yml' }
    - { src: 'grafana-datasource.yml.j2', dest: 'grafana/provisioning/datasources/datasource.yml' }
    - { src: 'grafana-dashboards.yml.j2', dest: 'grafana/provisioning/dashboards/dashboards.yml' }
  notify: Redémarrer la stack monitoring
  tags:
    - monitoring

- name: Copier les dashboards Grafana
  ansible.builtin.copy:
    src: "dashboards/"
    dest: "{{ monitoring_stack_dir }}/grafana/dashboards/"
    mode: '0644'
  tags:
    - monitoring

- name: Démarrer la stack monitoring
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_stack_dir }}"
    state: present
  tags:
    - monitoring

- name: Corriger les permissions du volume Loki
  ansible.builtin.file:
    path: "/var/lib/docker/volumes/monitoring_loki-data/_data"
    owner: "{{ loki_user_id }}"
    group: "{{ loki_group_id }}"
    state: directory
    recurse: yes
  become: yes
  tags:
    - monitoring

- name: Vérifier que tous les conteneurs sont démarrés
  community.docker.docker_container_info:
    name: "{{ item }}"
  loop:
    - prometheus
    - grafana
    - alertmanager
    - node-exporter
    - cadvisor
    - loki
    - promtail
  register: containers_status
  until: containers_status.container.State.Status == "running"
  retries: 30
  delay: 2
  tags:
    - monitoring

- name: Attendre que Prometheus soit prêt
  ansible.builtin.uri:
    url: "http://localhost:{{ prometheus_port }}/-/ready"
    status_code: 200
    timeout: 5
  register: prometheus_ready
  until: prometheus_ready.status == 200
  retries: 30
  delay: 5
  failed_when: false
  tags:
    - monitoring

- name: Attendre que Grafana soit prêt
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/health"
    status_code: 200
    timeout: 5
  register: grafana_ready
  until: grafana_ready.status == 200
  retries: 30
  delay: 3
  failed_when: false
  tags:
    - monitoring

- name: Récupérer les versions des images déployées
  community.docker.docker_container_info:
    name: "{{ item }}"
  loop:
    - prometheus
    - grafana
    - alertmanager
    - node-exporter
    - cadvisor
    - loki
    - promtail
  register: container_info
  tags:
    - monitoring

- name: Créer le fichier de versions
  ansible.builtin.copy:
    content: |
      # Versions de la stack monitoring
      # Généré automatiquement le {{ ansible_facts['date_time']['iso8601'] }}

      {% for container in container_info.results %}
      {{ container.item }}: {{ container.container.Config.Image }}
      {% endfor %}
    dest: "{{ monitoring_stack_dir }}/versions.txt"
    mode: '0644'
  tags:
    - monitoring

- name: Mettre à jour le README avec les versions déployées
  ansible.builtin.lineinfile:
    path: "{{ role_path }}/README.md"
    regexp: "^\\*\\*{{ item.name }}\\*\\*:"
    line: "- **{{ item.name }}**: {{ item.version }}"
    state: present
  loop:
    - { name: 'Prometheus', version: "{{ container_info.results[0].container.Config.Image.split(':')[1] | default('latest') }}" }
    - { name: 'Grafana', version: "{{ container_info.results[1].container.Config.Image.split(':')[1] | default('latest') }}" }
    - { name: 'Alertmanager', version: "{{ container_info.results[2].container.Config.Image.split(':')[1] | default('latest') }}" }
    - { name: 'Node Exporter', version: "{{ container_info.results[3].container.Config.Image.split(':')[1] | default('latest') }}" }
    - { name: 'cAdvisor', version: "{{ container_info.results[4].container.Config.Image.split(':')[1] | default('latest') }}" }
    - { name: 'Loki', version: "{{ container_info.results[5].container.Config.Image.split(':')[1] | default('latest') }}" }
    - { name: 'Promtail', version: "{{ container_info.results[6].container.Config.Image.split(':')[1] | default('latest') }}" }
  delegate_to: localhost
  become: no
  tags:
    - monitoring

- name: Mettre à jour la date de dernière vérification dans le README
  ansible.builtin.lineinfile:
    path: "{{ role_path }}/README.md"
    regexp: "^\\*\\*Dernière vérification\\*\\*:"
    line: "**Dernière vérification**: {{ ansible_facts['date_time']['date'] }}"
    state: present
  delegate_to: localhost
  become: no
  tags:
    - monitoring

- name: Afficher les URLs d'accès
  ansible.builtin.debug:
    msg:
      - "✅ Stack monitoring déployée avec succès"
      - "Prometheus: http://{{ ansible_host }}:{{ prometheus_port }}"
      - "Grafana: http://{{ ansible_host }}:{{ grafana_port }} ({{ grafana_admin_user }}/{{ grafana_admin_password }})"
      - "Alertmanager: http://{{ ansible_host }}:{{ alertmanager_port }}"
      - "Node Exporter: http://{{ ansible_host }}:{{ node_exporter_port }}/metrics"
      - "cAdvisor: http://{{ ansible_host }}:{{ cadvisor_port }}"
      - "Loki: http://{{ ansible_host }}:{{ loki_port }}"
      - ""
      - "📋 Versions déployées: {{ monitoring_stack_dir }}/versions.txt"
  tags:
    - monitoring
