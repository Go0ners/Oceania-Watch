---
# Versions
prometheus_version: "latest"
grafana_version: "latest"
alertmanager_version: "latest"
node_exporter_version: "latest"
cadvisor_version: "latest"
loki_version: "latest"

# Ports
prometheus_port: 9090
grafana_port: 3000
alertmanager_port: 9093
node_exporter_port: 9100
cadvisor_port: 8080
loki_port: 3100

# Prometheus
prometheus_scrape_interval: "15s"
prometheus_evaluation_interval: "15s"
prometheus_retention: "15d"
prometheus_user_id: "65534"
prometheus_group_id: "65534"

# Grafana
grafana_admin_user: "admin"
grafana_admin_password: "{{ vault_grafana_admin_password | default('changeme') }}"
grafana_root_url: "http://{{ ansible_host }}:3000"
grafana_plugins: "grafana-clock-panel"
grafana_user_id: "472"
grafana_group_id: "472"

# Alertmanager
alertmanager_webhook_url: "http://localhost:5001/"
alertmanager_critical_webhook_url: "http://localhost:5001/critical"
alertmanager_user_id: "65534"
alertmanager_group_id: "65534"

# Node Exporter
node_exporter_user_id: "65534"
node_exporter_group_id: "65534"

# Loki
loki_retention_period: "168h"
loki_user_id: "10001"
loki_group_id: "10001"

# Promtail
promtail_enabled: true

# Deployment
monitoring_stack_dir: "/opt/monitoring"
monitoring_compose_file: "docker-compose.yml"
