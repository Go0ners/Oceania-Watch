---
- name: Mettre à jour le cache DNF
  ansible.builtin.dnf:
    update_cache: yes
  changed_when: false
  tags:
    - system-update

- name: Mettre à jour tous les paquets système
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: yes
  register: system_update
  notify: Redémarrer le système si nécessaire
  tags:
    - system-update

- name: Nettoyer le cache et les métadonnées DNF
  ansible.builtin.dnf:
    autoremove: yes
  tags:
    - system-update

- name: Vérifier si un redémarrage est nécessaire
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required
  tags:
    - system-update

- name: Récupérer les facts sur les paquets installés
  ansible.builtin.package_facts:
    manager: auto
  tags:
    - system-update

- name: Afficher le nombre de paquets installés
  ansible.builtin.debug:
    msg: "Nombre de paquets installés: {{ ansible_facts.packages | length }}"
  tags:
    - system-update
